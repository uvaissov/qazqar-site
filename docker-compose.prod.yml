# QazQar Site — прод/стейджинг стек.
# Все порты публикуются только на 127.0.0.1 (наружу проксирует системный nginx на VM).
# Значения секретов берутся из /opt/qazqar/.env (interpolation + env_file).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL}
    container_name: qazqar-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: qazqar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qazqar
      POSTGRES_USER: qazqar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qazqar"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: qazqar-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: qazqar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY};
      mc mb local/${MINIO_BUCKET} --ignore-existing;
      mc anonymous set download local/${MINIO_BUCKET};
      exit 0;
      "

  # Стейджинг: реального SMTP нет — OTP-письма ловим в mailhog (UI на 127.0.0.1:8025).
  mailhog:
    image: mailhog/mailhog:latest
    container_name: qazqar-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  minio_data:
