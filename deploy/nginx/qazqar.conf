# QazQar Site — реверс-прокси на VM (/etc/nginx/sites-available/qazqar).
# TLS терминируется внешним шлюзом Proxmox → приходит на VM:80 по HTTP.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name qazqar.d3v.kz _;

  client_max_body_size 25m;        # загрузка фото авто в админке

  # Картинки из MinIO: объекты лежат по /qazqar-images/<file>
  location /qazqar-images/ {
    proxy_pass http://127.0.0.1:9002;
    proxy_set_header Host $host;
  }

  # Mailhog: отладочный ящик для OTP-писем, ОТКРЫТ БЕЗ АВТОРИЗАЦИИ.
  # Путь совпадает с MH_UI_WEB_PATH в docker-compose.prod.yml — mailhog сам отдаёт
  # себя под /mailhog/, поэтому префикс не срезаем (proxy_pass без пути).
  # Убрать, когда стенд переедет на реальный SMTP: внутри лежат коды подтверждения.
  location /mailhog/ {
    proxy_pass http://127.0.0.1:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;      # live-обновление списка писем
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 3600s;                    # EventSource держит соединение долго
    proxy_buffering off;
  }

  # SSE статусов заявок (кабинет и мобилка). Ответ должен уходить клиенту
  # по мере появления событий, поэтому буферизацию выключаем и здесь, и на
  # внешнем TLS-шлюзе: заголовок X-Accel-Buffering от приложения nginx
  # честно исполняет, но дальше не пропускает — выставляем его заново сами.
  location = /api/cabinet/bookings/events {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control no-cache always;
  }

  # Next.js приложение
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # снаружи это HTTPS (TLS на шлюзе)
    proxy_read_timeout 120s;
  }
}
